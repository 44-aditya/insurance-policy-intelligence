[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-policy-intelligence"
version = "0.1.0"
description = "Evaluation-driven insurance policy text extraction experiments"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.26,<2",
  "voyageai>=0.5,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
stage2 = [
  "sentence-transformers>=5,<6",
]

[project.scripts]
extract-policy-pages = "policy_extraction.extract:main"
validate-gold-dataset = "evaluation.validate_gold_dataset:main"
analyze-corpus-structure = "corpus_analysis.analyze:main"
run-semantic-retrieval = "semantic_retrieval.experiment:main"
run-full-ranking-diagnostic = "semantic_retrieval.full_ranking_diagnostic:main"
run-stage2-reranking = "semantic_retrieval.stage2_reranking:main"
run-stage2b-voyage-reranking = "semantic_retrieval.stage2b_voyage_reranking:main"
rescore-evaluation-v2 = "evaluation.contract_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
